name: Pull Request

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep CI logs quiet and fast: at DEBUG the DataStax driver alone emitted ~170k
# lines per run, which slows the tests (synchronous console I/O) and made the
# embedded Cassandra more likely to miss request deadlines. Test failures still
# print their stack traces regardless of these levels.
env:
  LOG_LEVEL: WARN
  CASSANDRA_LOG_LEVEL: WARN

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'sbt'

      - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1

      - name: Check formatting, scalafix, and headers
        run: sbt styleCheck

      - name: Check MiMa
        run: sbt mimaReportBinaryIssues

      - name: Run OSV Scan
        run: sbt -Dlog4j2.level=info 'osvScan all-projects single-report list-unused-suppressions offending-vulnerabilities-summary'

      - name: Check docs
        run: sbt docs/mdoc

      - name: Test Coverage (Scala 2.13)
        run: sbt testCoverage

      # `testCoverage` above only exercises the default Scala 2.13. Cross-test the
      # modules that also cross-build to 2.12 so a 2.12-only breakage cannot ship
      # unnoticed (the 2.13-only modules, tables, akka, pekko, are excluded).
      - name: Test Scala 2.12
        run: sbt ++2.12.21 core/test monix/test zio/test flink/test spark/test

  # The test suite embeds Cassandra 3.11 (cassandra-unit), which only runs on
  # JDK 11, so the tests execute in the `build` job above. Here we at least verify
  # the library compiles on newer LTS JDKs to catch bytecode/API incompatibilities.
  compile-jdk:
    name: Compile (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'

      - uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1

      - name: Compile (main + test)
        run: sbt Test/compile
