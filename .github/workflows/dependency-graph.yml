name: Dependency Graph

# Submits the resolved sbt dependency tree to GitHub's Dependency Graph so that
# Dependabot security alerts flag CVEs in transitive dependencies (for example
# the jackson/netty shaded inside the DataStax driver). This is the sbt-native
# equivalent of Dependabot's dependency scanning, which does not support sbt.
on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - uses: scalacenter/sbt-dependency-submission@v3
