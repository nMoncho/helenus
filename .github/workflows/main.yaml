name: CI

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  LOG_LEVEL: DEBUG
  CASSANDRA_LOG_LEVEL: DEBUG

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'sbt'

      - uses: sbt/setup-sbt@v1

      - name: Check formatting, scalafix, and headers
        run: sbt styleCheck

      - name: Check MiMa
        run: sbt mimaReportBinaryIssues

      - name: Check docs
        run: sbt docs/mdoc

      - name: Test Coverage (Scala 2.13)
        run: sbt testCoverage

      # `testCoverage` above only exercises the default Scala 2.13. Cross-test the
      # modules that also cross-build to 2.12 so a 2.12-only breakage cannot ship
      # unnoticed (the 2.13-only modules — tables, akka, pekko — are excluded).
      - name: Test Scala 2.12
        run: sbt ++2.12.21 core/test monix/test zio/test flink/test
