# Example configuration for a Helenus migration job.
#
# In a real deployment this is your application.conf. Every knob under
# `helenus-migration` maps to a parameter the library takes directly, so the config
# only exists in the runnable example app, not in the library.

helenus-migration {

  # How finely to split each node's token ranges (executor: TokenRangePlanner.plan
  # splitsPerRange). More splits give finer checkpoint and retry granularity; too many
  # add per-query overhead.
  token-range-splits = 8

  # How many ranges to read concurrently (executor: asTokenRangeReadSource parallelism).
  # Decouples read throughput from the node count.
  parallelism = 8

  # Optional rate cap to protect the target cluster (executor: RateLimit). Remove this
  # block to run uncapped; reactive backpressure still keeps the source from outrunning
  # the sink.
  throttling {
    elements = 1000 # at most this many rows ...
    per      = 1s    # ... per this duration
  }

  # Optional named driver execution profile for the reads (executor: executionProfile),
  # for example a lower read consistency for throughput. Remove to use the session
  # default.
  read-execution-profile = "migration-read"

  # Dry run: read and transform (and count) but write nothing, to validate the extract
  # and transform without touching the target.
  dry-run = false

  # Liveness endpoint for orchestration (Kubernetes, etc.), served by the example app.
  health-check {
    host = "0.0.0.0"
    port = 8080
    url  = "health"
  }
}

# Standard DataStax driver configuration.
datastax-java-driver {
  basic {
    contact-points                          = ["localhost:9042"]
    session-keyspace                        = "my_keyspace"
    load-balancing-policy.local-datacenter  = "dc1"
    request.consistency                     = LOCAL_QUORUM
  }

  # The read profile referenced by `read-execution-profile`: a lower consistency for
  # throughput, independent of the LOCAL_QUORUM writes above.
  profiles.migration-read.basic.request.consistency = LOCAL_ONE
}
